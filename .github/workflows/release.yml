name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: server/cmd/castserver/frontend

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w" \
            -o "castserver-linux-${{ matrix.arch }}" \
            ./cmd/castserver
        working-directory: server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: castserver-linux-${{ matrix.arch }}
          path: server/castserver-linux-${{ matrix.arch }}

  build-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: server/cmd/castserver/frontend

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - name: Build binary
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w" \
            -o "castserver-windows-${{ matrix.arch }}.exe" \
            ./cmd/castserver
        working-directory: server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: castserver-windows-${{ matrix.arch }}
          path: server/castserver-windows-${{ matrix.arch }}.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/castserver-*
          generate_release_notes: true
