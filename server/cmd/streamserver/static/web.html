<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Web Client</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: #ddd;
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    height: 100%;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    background: #000;
  }
  #view {
    max-width: 100%;
    max-height: 100%;
    display: none;
    /* Crisp pixel scaling for low-res streams (e.g. 256×192 on a phone). */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  /* Real (browser) fullscreen — desktop / iPad. Split rules: a comma-list
     mixing :fullscreen with a vendor prefix gets the whole rule dropped. */
  :fullscreen #wrap { width: 100vw; height: 100vh; background: #000; }
  :-webkit-full-screen #wrap { width: 100vw; height: 100vh; background: #000; }
  :fullscreen #view { max-width: 100vw; max-height: 100vh; }
  :-webkit-full-screen #view { max-width: 100vw; max-height: 100vh; }
  /* Fake fullscreen — iOS Safari can't fullscreen a div, so we let the
     body scroll past the viewport so the URL-bar-collapse trick works. */
  body.cssfs {
    overflow: auto;
    height: auto;
    min-height: 101vh;
    -webkit-overflow-scrolling: touch;
  }
  body.cssfs #wrap {
    height: 100vh;
    /* On iOS Safari this is the visible area minus the URL bar. */
    height: -webkit-fill-available;
  }
  body.cssfs #overlay { display: none; }
  body.cssfs.show-overlay #overlay { display: block; }
  #overlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 8px 10px;
    background: rgba(0,0,0,0.55);
    font-size: 13px;
    line-height: 1.3;
    z-index: 20;
    -webkit-transition: opacity 0.4s;
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay button {
    font-size: 13px;
    padding: 4px 10px;
    margin-right: 4px;
    background: #2a6; color: #fff;
    border: 1px solid #2a6;
    border-radius: 4px;
  }
  #overlay button.stop { background: #c33; border-color: #c33; }
  #status { margin-top: 6px; color: #8c8; }
  #status.err { color: #f88; }
  #status.idle { color: #ccc; }
  #stats { color: #999; font-size: 11px; }
  #tap {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="view" alt="">
  <div id="overlay">
    <div>
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn" class="stop">Disconnect</button>
      <button id="fsBtn">⛶ Fullscreen</button>
    </div>
    <div id="status" class="idle">Tap Connect to view the active stream.</div>
    <div id="stats"></div>
  </div>
  <div id="tap"></div>
</div>

<script>
(function () {
  var ws = null;
  var lastUrl = null;
  var frameCount = 0;
  var byteCount = 0;
  var statsT = 0;

  var view    = document.getElementById('view');
  var status  = document.getElementById('status');
  var stats   = document.getElementById('stats');
  var overlay = document.getElementById('overlay');
  var tap     = document.getElementById('tap');
  var connectBtn = document.getElementById('connectBtn');
  var disconnectBtn = document.getElementById('disconnectBtn');
  var fsBtn = document.getElementById('fsBtn');
  var wrap = document.getElementById('wrap');

  function setStatus(msg, kind) {
    status.textContent = msg;
    status.className = kind || 'idle';
  }

  function showOverlay() {
    overlay.className = '';
    clearTimeout(showOverlay._t);
    showOverlay._t = setTimeout(function () {
      if (ws && ws.readyState === 1 && view.style.display !== 'none') overlay.className = 'hidden';
    }, 2500);
  }

  tap.addEventListener('touchstart', showOverlay, false);
  tap.addEventListener('click', showOverlay, false);

  function connect() {
    if (ws) return;
    var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = proto + '//' + window.location.host + '/ws/web';

    setStatus('Connecting...');
    try {
      ws = new WebSocket(url);
    } catch (e) {
      setStatus('WebSocket failed: ' + e.message, 'err');
      return;
    }
    ws.binaryType = 'blob';

    ws.onopen = function () {
      setStatus('Connected. Waiting for stream...');
      frameCount = 0; byteCount = 0; statsT = Date.now();
    };

    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') {
        try {
          var m = JSON.parse(ev.data);
          if (m.error) { setStatus('Server: ' + m.error, 'err'); ws.close(); return; }
          if (m.status === 'streaming') {
            setStatus('Connected — receiving stream.');
            showOverlay();
          } else if (m.status === 'idle') {
            setStatus('Connected — no active session. Press Start on the server UI.');
          }
        } catch (e) {}
        return;
      }
      var blob = ev.data;
      byteCount += blob.size;
      frameCount++;
      var newUrl = URL.createObjectURL(blob);
      view.style.display = 'block';
      view.src = newUrl;
      if (lastUrl) {
        var prev = lastUrl;
        setTimeout(function () { URL.revokeObjectURL(prev); }, 100);
      }
      lastUrl = newUrl;

      var now = Date.now();
      if (now - statsT > 1000) {
        var dt = (now - statsT) / 1000;
        stats.textContent = (frameCount / dt).toFixed(1) + ' fps   ' +
                            (byteCount * 8 / 1000 / dt).toFixed(0) + ' kbps';
        frameCount = 0; byteCount = 0; statsT = now;
      }
    };

    ws.onerror = function () {
      setStatus('WebSocket error.', 'err');
    };

    ws.onclose = function () {
      var was = ws;
      ws = null;
      if (was) setStatus('Disconnected.');
      overlay.className = '';
    };
  }

  function disconnect() {
    if (ws) {
      try { ws.close(); } catch (e) {}
      ws = null;
    }
    view.style.display = 'none';
    if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
    setStatus('Disconnected.');
    stats.textContent = '';
    overlay.className = '';
  }

  connectBtn.addEventListener('click', function (e) { e.stopPropagation(); connect(); }, false);
  disconnectBtn.addEventListener('click',  function (e) { e.stopPropagation(); disconnect(); }, false);

  // ---------- Fullscreen ----------
  function inFakeFs() { return document.body.classList.contains('cssfs'); }
  function inRealFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function enterFullscreen() {
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    if (req) {
      try { req.call(wrap); return; } catch (e) {}
    }
    // Fallback: iOS Safari can't fullscreen arbitrary elements.
    document.body.classList.add('cssfs');
    // Nudge iOS Safari to collapse its URL bar.
    setTimeout(function () { window.scrollTo(0, 1); }, 0);
    syncFsBtn();
  }
  function exitFullscreen() {
    if (inRealFs()) {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) { try { ex.call(document); } catch (e) {} }
    }
    if (inFakeFs()) {
      document.body.classList.remove('cssfs');
    }
    syncFsBtn();
  }
  function toggleFullscreen() {
    if (inRealFs() || inFakeFs()) exitFullscreen();
    else enterFullscreen();
  }
  function syncFsBtn() {
    fsBtn.textContent = (inRealFs() || inFakeFs()) ? '⛶ Exit fullscreen' : '⛶ Fullscreen';
  }
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFullscreen(); showOverlay(); }, false);
  document.addEventListener('fullscreenchange', syncFsBtn, false);
  document.addEventListener('webkitfullscreenchange', syncFsBtn, false);
  // ESC out of fake fullscreen too.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && inFakeFs()) exitFullscreen();
  }, false);

  // Auto-connect on load — there's nothing else to do on this page.
  connect();
})();
</script>

</body>
</html>
